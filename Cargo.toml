[package]
name = "etcat"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Netcat-like, rootless peer-to-peer connections over EasyTier"
license = "Apache-2.0"
repository = "https://github.com/EasyTier/etcat"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
ciborium = "0.2"
directories = "6.0"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
easytier = { git = "https://github.com/EasyTier/EasyTier.git", rev = "164e2db6aecd13117d840821d5b889b51cb7c463", default-features = false, features = [
    "aes-gcm",
    "endpoint-discovery",
    "logging",
    "quic",
    "smoltcp",
    "socks5",
    "tcp-hole-punch",
    "upnp",
    "websocket",
    "zstd",
] }
easytier-core = { git = "https://github.com/EasyTier/EasyTier.git", rev = "164e2db6aecd13117d840821d5b889b51cb7c463", default-features = false, features = [
    "aes-gcm",
    "endpoint-discovery",
    "proxy-smoltcp-stack",
    "tcp-hole-punch",
] }
hex = "0.4"
hostname = "0.4"
hpke = { version = "0.14", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
hickory-resolver = "0.25"
humantime = "2.2"
rand = "0.8"
rand10 = { package = "rand", version = "0.10" }
russh = { version = "0.63", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["v4"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

[target.'cfg(unix)'.dependencies]
portable-pty = "0.9"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.21"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
