name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          package_version=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            executable: etcat
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            executable: etcat
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: etcat
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            executable: etcat
            archive: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: etcat.exe
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: etcat.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools protobuf-compiler
          protoc --version
      - name: Install protoc on macOS
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          protoc --version
      - name: Install protoc on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc --yes --no-progress
          protoc --version
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify static Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          file "$binary"
          if readelf --program-headers "$binary" | grep -q 'Requesting program interpreter'; then
            echo "$binary is dynamically linked" >&2
            exit 1
          fi
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_name="etcat-${GITHUB_REF_NAME}-${{ matrix.target }}"
          package_dir="dist/$package_name"
          mkdir -p "$package_dir"
          install -m 0755 \
            "target/${{ matrix.target }}/release/${{ matrix.executable }}" \
            "$package_dir/${{ matrix.executable }}"
          cp README.md LICENSE "$package_dir/"
          tar --directory dist --create --gzip \
            --file "dist/$package_name.${{ matrix.archive }}" \
            "$package_name"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageName = "etcat-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          $packageDir = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item `
            "target/${{ matrix.target }}/release/${{ matrix.executable }}" `
            $packageDir
          Copy-Item README.md, LICENSE $packageDir
          Compress-Archive `
            -Path $packageDir `
            -DestinationPath "dist/$packageName.${{ matrix.archive }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum etcat-* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
